# Written by `ibara unattended-boot enable`; `ibara unattended-boot disable` removes it.
# The initramfs runs systemd, so the TPM can unlock the disk (sd-encrypt), and it still
# asks for the password whenever the TPM refuses. Omarchy's other hooks stay as they are.
_ibara_hooks=()
for _ibara_hook in "${HOOKS[@]}"; do
  case $_ibara_hook in
    udev) _ibara_hooks+=(systemd) ;;
    keymap | consolefont) [[ " ${_ibara_hooks[*]} " == *" sd-vconsole "* ]] || _ibara_hooks+=(sd-vconsole) ;;
    encrypt) _ibara_hooks+=(sd-encrypt) ;;
    btrfs-overlayfs) _ibara_hooks+=(sd-btrfs-overlayfs) ;;
    resume) ;; # the systemd hook resumes from hibernation itself
    *) _ibara_hooks+=("$_ibara_hook") ;;
  esac
done
HOOKS=("${_ibara_hooks[@]}")
unset _ibara_hooks _ibara_hook
