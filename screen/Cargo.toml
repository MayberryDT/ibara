[package]
name = "ibara-screen"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[features]
qualification = []
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
evdev = "0.13"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = "0.20"
openh264 = "0.9"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
cros-codecs = { path = "vendor/cros-codecs", features = ["vaapi"] }
libva = { package = "cros-libva", version = "0.0.12" }
gbm = { version="0.15", default-features=false, features=["drm-support"] }
moq-nvenc = "=0.1.0"
cudarc = { version = "0.19", default-features = false, features = ["driver", "fallback-dynamic-loading", "cuda-12020"] }
libloading = "0.9"
pipewire = "0.10"
futures-util = "0.3"
zbus = { version = "5", features = ["blocking-api"] }
[build-dependencies]
cc = "1"
